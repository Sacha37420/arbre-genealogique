version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net

services:

  backend:
    build: ./backend
    container_name: arbre-genealogique-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8090:8000"
    networks:
      - sso-net
      - dev-net
    # Pas de montage du code : il est copié dans l'image (Dockerfile, COPY . .).
    # Un montage ./backend:/app mettait en service le contenu du dossier à chaque
    # redémarrage, sans passer par les tests du chemin à portes.
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/arbre-genealogique-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  frontend:
    build: ./frontend
    container_name: arbre-genealogique-frontend
    restart: unless-stopped
    # Uniquement les variables que lit nginx-entrypoint.sh pour écrire env.js —
    # aucune n'est secrète (env.js est servi au navigateur). `env_file: .env`
    # donnait à ce conteneur nginx tous les secrets de l'app.
    environment:
      DOMAIN: ${DOMAIN:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      PORT_BACKEND: ${PORT_BACKEND:-}
      PORT_FRONTEND: ${PORT_FRONTEND:-}
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:4208:80"
    networks:
      - sso-net
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/nginx-entrypoint.sh:/docker-entrypoint.d/40-env-config.sh:ro
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/arbre-genealogique/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
